# Render Blueprint — https://render.com/docs/blueprint-spec
# After first deploy: set secrets in the Render dashboard (DATABASE_URL, JWT_SECRET, ENCRYPTION_KEY, SMTP_*, etc.).
# CORS_ORIGIN and PUBLIC_APP_URL must match the browser URL (e.g. https://your-app.onrender.com).
# Gmail SMTP: SMTP_HOST=smtp.gmail.com, PORT=587, SECURE=false, USER/FROM=same Gmail, PASS=Google App Password. Omit RESEND_API_KEY if not using Resend.

version: "1"
services:
  - type: web
    name: eewa
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STATIC_FILES_DIR
        value: /app/public
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
